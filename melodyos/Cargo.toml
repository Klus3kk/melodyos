[package]
name = "melodyos"
version = "0.1.0"
edition = "2018"

[dependencies]
bootloader = { version = "0.9.8", features = ["map_physical_memory"] }
volatile = "0.2.6"
spin = "0.5.2"

[dependencies.lazy_static]
version = "1.0"
features = ["spin_no_std"]

# Disable the standard bootimage behavior
[package.metadata.bootimage]
default-target = "x86_64-melody_os.json"
run-command = ["qemu-system-x86_64", "-drive", "format=raw,file={}"]

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"